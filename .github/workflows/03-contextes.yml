name: CI - Contextes

on:
  push:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

env:
  APP_NAME: fastapi-starter

jobs:
  lint:
    name: Lint – Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Afficher les contextes
        env:
          CONTEXT_APP_NAME: ${{ env.APP_NAME }}
          CONTEXT_ACTOR: ${{ github.actor }}
          CONTEXT_EVENT: ${{ github.event_name }}
          CONTEXT_BRANCH: ${{ github.ref_name }}
          CONTEXT_SHA: ${{ github.sha }}
          CONTEXT_OS: ${{ runner.os }}
          CONTEXT_HEAD: ${{ github.head_ref }}
          CONTEXT_BASE: ${{ github.base_ref }}
        run: |
          echo "Application: $CONTEXT_APP_NAME"
          echo "Acteur: $CONTEXT_ACTOR"
          echo "Evenement: $CONTEXT_EVENT"
          echo "Branche: $CONTEXT_BRANCH"
          echo "SHA: $CONTEXT_SHA"
          echo "OS: $CONTEXT_OS"
          echo "Branche source PR: $CONTEXT_HEAD"
          echo "Branche cible PR: $CONTEXT_BASE"
      - name: Afficher le contexte GitHub en JSON
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "$GITHUB_CONTEXT"
          echo "Message du commit (push): $COMMIT_MESSAGE"
      - name: Vérifier le style
        run: ruff check .
  build:
    name: Build – Vérifier l’application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compiler le code
        run: python -m compileall app
      - name: Importer l’application
        run: python -c "from app.main import app; print(app.title)"
  test:
    name: Test – Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Exécuter les tests
        run: pytest
